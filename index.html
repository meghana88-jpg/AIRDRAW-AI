
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirDraw AI - Virtual Drawing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>AirDraw AI</h1>
        <p>Draw in the air using your hand gestures!</p>
    </header>

    <main>
        <div class="drawing-area">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="colorPicker">Brush Color</label>
                <input type="color" id="colorPicker" value="#ff0000">
            </div>

            <div class="control-group">
                <label for="brushSize">Brush Size</label>
                <input type="range" id="brushSize" min="2" max="30" value="5">
            </div>

            <div class="control-group">
                <label for="drawingMode">Drawing Mode</label>
                <select id="drawingMode">
                    <option value="draw">Draw</option>
                    <option value="move">Move</option>
                    <option value="erase">Erase</option>
                </select>
            </div>

            <button id="undoBtn">Undo</button>
            <button id="clearBtn">Clear</button>
            <button id="saveBtn">Save PNG</button>
        </div>

        <div class="camera-controls">
            <button id="startCamera">Start Camera</button>
            <p id="status">Camera not started</p>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
